name: Generate Snake Animation

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: productivityx007-coder
          outputs: |
            dist/github-snake.svg?color_snake=#22d3ee&color_dots=#0b1220,#123047,#155e75,#0891b2,#22d3ee
            dist/github-snake-dark.svg?color_snake=#22d3ee&color_dots=#0b1220,#123047,#155e75,#0891b2,#22d3ee

      - name: Deploy snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
